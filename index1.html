<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style1.css">
  
</head>
<body>
    
<form action="index.html" onsubmit="return ValidateForm()">
  

      <div class=" fullForm col-md-4">
          <h2>SIGN UP </h2>
    <label for="validationCustom01" class="form-label">Full Name</label>
    <input type="text" class="form-control" id="validationCustom01" value=""/>
    <span id="validationCustom01error" class="error-message"></span>
    <div class="valid-feedback">
      
    </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="text" class="form-control" id="exampleInputEmail1" value=""/>
    <span id="exampleInputEmail1error" class="error-message"></span>
  
  </div>
  <div class="  password-box mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1" oninput="checkPasswordStrength()" value=""/><div id="passwordStrength"></div>
     <button type="button" class="show-password" onclick="togglepassword('exampleInputPassword1',this)">show password</button>
   
     <span id="exampleInputPassword1error" class="error-message"></span>
  </div>
    <div class="  mb-3">
    <label for="exampleInputPassword2" class="form-label"> Confirm Password</label>
    <input type="password" class="form-control" id="exampleInputPassword2" value=""/>
      <button type="button" class="show-password" onclick="togglePassword('exampleInputPassword2',this)">show password</button>
    
     <span id="exampleInputPassword2error" class="error-message"></span>

  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1" value=""/>
    <label class="form-check-label" for="exampleCheck1">Agree to 
      <a href="#" onclick="showTerms(); return false;"> terms and conditions</a>
     </label><br>
     <span id="exampleCheck1error" class="error-message"></span>

     <p id="termsText" style="display: none;">

      by siging up, you agree to our trems and conditions,
      please provide correct information and use this website responsibly.
     </p>
   </div>
 
    <button type="submit" class="btn btn-primary">Sign Up</button>
</form>


    <script src="index.js"></script>
</body>
</html>
